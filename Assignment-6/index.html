<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

    <h2>Unordered List</h2>
    <ul>
        <li>Apple</li>
        <li>Mango</li>
         </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>Wake up</li>
        <li>Get ready</li>
        <li>Go to college</li>
    </ol>

    <h2>Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>

        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
         </dl>

</body>
</html>
