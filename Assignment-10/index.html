<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Elements</title>
</head>
<body>

    <h3>Image</h3>
    <img src="college.jpg" alt="College campus"
         width="200" height="200">

    <h3>Video</h3>
    <video width="320" height="180" controls>
        <source src="video.mp4" type="video/mp4">
        [11:39 pm, 15/11/2026] Amrita Verma🩷:  Your browser does not support video.
    </video>

    <h3>Audio</h3>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <h3>YouTube</h3>
    <iframe width="330" height="200"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video"
        allowfullscreen>
    </iframe>

</body>
</html>
