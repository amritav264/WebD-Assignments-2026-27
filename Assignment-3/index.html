<!DOCTYPE html>
<html>
<head>
    <title>Block and Inline Elements</title>
</head>
<body>

    <h1>Block and Inline Elements</h1>

    <h2>Block Elements</h2>
    <div>This is a DIV element.</div>

    <p>This is a PARAGRAPH element.</p>

    <h3>This is a HEADING element.</h3>

    <ul>
<li>This is a LIST ITEM element.</li>
    </ul>

    <h2>Inline Elements</h2>

    <p>
        This is a <span>SPAN element</span>.
    </p>
    <p>
        This is a <b>BOLD element</b>.
    </p>

    <p>
        This is an <i>ITALIC element</i>.
    </p>

    <p>
This is a <a href="https://www.google.com">LINK element</a>.
    </p>

</body>
</html>
