<!DOCTYPE html>
<html>
<head>
    <title>Student Admission Page</title>

    <style>
        body {
            font-family: Arial;
            margin: 10px;
            border: 1px solid black;
            padding: 10px;
        }
         header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            width: 75%;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid gray;
            padding: 5px;
            text-align: left;
        }

        th {
            background-color: #e6e6f2;
            text-align: center;
        }
 fieldset {
            margin-top: 15px;
        }

        input, textarea, select {
            margin: 5px 0;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>ABC College Admission 2026</h1>
</header>

<main>

    <h3>Courses and Fees</h3>

    <table>
        <caption>Available Courses</caption>

        <tr>
            <th>Course</th>
            <th>Seats</th>
            <th>Fees</th>
        </tr>

        <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>₹90,000</td>
        </tr>

        <tr>
            <td>BCA</td>
            <td>60</td>
            <td>₹45,000</td>
        </tr>
    </table>

    <form action="#" method="post">

        <fieldset>
            <legend>Application Form</legend>

            <label for="name">Name:</label>
            <br>
            <input type="text" id="name"
            name="name" size="30" required>

            <br><br>

            <label for="email">Email:</label>
            <br>
            <input type="email" id="email"
            name="email" size="30" required>

            <br><br>

            <label for="course">Course:</label>
            <br>
            <select id="course" name="course">
                <option>B.Tech CSE</option>
                <option>BCA</option>
            </select>

            <br><br>

            <label for="statement">Statement:</label>
            <br>
            <textarea id="statement"
            name="statement" rows="4" cols="40"></textarea>

            <br><br>

            <button type="submit">Apply</button>

        </fieldset>

    </form>

</main>

<footer>
    © 2026 ABC College
</footer>

</body>
</html>
